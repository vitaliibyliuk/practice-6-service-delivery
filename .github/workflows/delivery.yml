name: Monitor delivery
run-name: ${{ github.event_name == 'workflow_dispatch' && format('Fault drill / {0}', inputs.scenario) || github.event.head_commit.message || github.event.pull_request.title }}

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      scenario:
        description: Fault scenario
        required: true
        type: choice
        options:
          - broken-test
          - offline

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  source:
    name: Resolve source revision
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    outputs:
      commit: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/heads/scenario/{0}', inputs.scenario) || '' }}
          persist-credentials: false
      - id: commit
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  api:
    name: API contract tests
    needs: source
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.source.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Validate the API
        run: |
          mkdir -p reports/api
          python -m pip install -r requirements-qa.txt 2>&1 | tee reports/api/pip.txt
          python -m pytest -q tests --junitxml=reports/api/results.xml 2>&1 | tee reports/api/pytest.txt
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: api-test-results
          path: reports/api/
          retention-days: 5

  image:
    name: Build commit image
    needs: source
    env:
      REVISION: ${{ needs.source.outputs.commit }}
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.source.outputs.commit }}
          persist-credentials: false
      - name: Build Linux image and record revision
        run: |
          mkdir -p reports/image
          image="ghcr.io/${GITHUB_REPOSITORY,,}:$REVISION"
          docker build --build-arg "RELEASE_ID=$REVISION" \
            --label "org.opencontainers.image.revision=$REVISION" \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            -t "$image" . 2>&1 | tee reports/image/build.txt
          if [[ "$GITHUB_EVENT_NAME" != pull_request ]]; then
            docker save "$image" | gzip -1 > tested-image.tar.gz
          fi
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: build-log
          path: reports/image/
          retention-days: 5
      - uses: actions/upload-artifact@v6
        if: github.event_name != 'pull_request'
        with:
          name: tested-image
          path: tested-image.tar.gz
          retention-days: 1
          compression-level: 0
          if-no-files-found: error

  release:
    name: Deploy and verify monitor
    needs: [source, api, image]
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: monitor-training
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    env:
      REVISION: ${{ needs.source.outputs.commit }}
      SERVICE_PORT: "8100"
      PUBLISHED_PORT: "8194"
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.source.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Prepare Linux checks
        run: |
          mkdir -p reports/release
          python -m pip install -r requirements-qa.txt 2>&1 | tee reports/release/pip.txt
      - uses: actions/download-artifact@v7
        with:
          name: tested-image
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Deploy candidate and recover if needed
        run: |
          registry="ghcr.io/${GITHUB_REPOSITORY,,}"
          docker load --input tested-image.tar.gz | tee reports/release/docker-load.txt
          docker push "$registry:$REVISION" 2>&1 | tee reports/release/docker-push.txt
          python ops/release.py "$registry" "$REVISION" 2>&1 | tee reports/release/rollout.txt
      - name: Collect final container logs
        if: always()
        run: |
          mkdir -p reports/release
          export SERVICE_IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}:$REVISION"
          docker compose logs --no-color --timestamps monitor > reports/release/final-container.txt 2>&1 || true
          docker compose down > reports/release/cleanup.txt 2>&1 || true
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: linux-release-evidence
          path: reports/release/
          retention-days: 5
